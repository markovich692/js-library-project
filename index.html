<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="script.js"></script>
    <title>Library</title>
  </head>
  <body>
    <h1>Library</h1>

    <form action="" class="book-form">
      <label for="title" name="title">Title:</label>
      <input type="text" id="title" class="book-form__title" required />

      <label for="author" name="author">Author:</label>
      <input type="text" id="author" class="book-form__author" required />

      <label for="pages" name="pages">Pages:</label>
      <input type="number" id="pages" class="book-form__pages" required />

      <button class="book-form__submit">SUBMIT</button>
    </form>

    <div class="books-container hidden">
      <div class="book-card" data-book-card-id="">
        <p class="book-card__field">
          <span class="book-card__label">id:</span>
          <span class="book-card__id"></span>
        </p>

        <p class="book-card__field">
          <span class="book-card__label">Title:</span>
          <span class="book-card__title"></span>
        </p>

        <p class="book-card__field">
          <span class="book-card__label">Author:</span>
          <span class="book-card__author"></span>
        </p>

        <p class="book-card__field">
          <span class="book-card__label">Pages:</span>
          <span class="book-card__pages"></span>
        </p>

        <div class="book-card__field">
          <label class="book-card__read-label">
            Read:
            <input type="checkbox" class="book-card__read-checkbox" data-book-card-id="" />
          </label>
        </div>

        <button class="book-card__delete">Delete card</button>
      </div>
    </div>
  </body>
</html>
